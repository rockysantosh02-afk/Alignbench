 [build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alignbench"
version = "0.1.0"
description = "An open-source benchmark for evaluating alignment behavior of language models"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]